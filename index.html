<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Travel Architect | Personal Master Trip Hub</title>
  
  <!-- PWA & Mobile Meta -->
  <meta name="description" content="Personal Travel Architect & Master Multi-Trip Hub" />
  <meta name="theme-color" content="#090d16" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"]
          },
          colors: {
            brand: {
              emerald: "#10b981",
              teal: "#14b8a6",
              dark: "#090d16"
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  
  <!-- Offline PWA Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").then((reg) => {
          console.log("PWA Service Worker registered with scope:", reg.scope);
        }).catch((err) => {
          console.warn("SW registration error:", err);
        });
      });
    }
  </script>
</body>
</html>
